<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>井潇琳 · 个人简历</title>
<meta name="description" content="井潇琳 — 财务管理本科在读，AI 工具驱动型创作者。AI 编程建站 / AI 内容生产 / 短剧创作 / 活动宣讲。">
<style>
  /* ============ 主题变量 ============ */
  :root{
    --bg:#f5f7fc;
    --bg-2:#eef1fb;
    --surface:#ffffff;
    --surface-2:#f8f9ff;
    --text:#1f2330;
    --muted:#6b7280;
    --border:#e6e9f2;
    --primary:#4f63f0;
    --primary-soft:#eaeefe;
    --primary-ink:#3a4cd6;
    --accent:#f5a623;
    --accent-soft:#fdf2dd;
    --shadow:0 6px 24px rgba(40,52,120,.08);
    --shadow-hover:0 14px 38px rgba(40,52,120,.16);
    --radius:16px;
    --radius-sm:10px;
    --maxw:1080px;
    --nav-h:62px;
  }
  html[data-theme="dark"]{
    --bg:#0e1018;
    --bg-2:#141826;
    --surface:#171b27;
    --surface-2:#1d2231;
    --text:#e7eaf3;
    --muted:#9aa3b9;
    --border:#272d3d;
    --primary:#7d8dff;
    --primary-soft:#1f2440;
    --primary-ink:#9aa6ff;
    --accent:#fbbf24;
    --accent-soft:#2c2410;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --shadow-hover:0 16px 42px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 500px at 12% -8%, color-mix(in srgb,var(--primary) 14%,transparent), transparent 60%),
      radial-gradient(800px 480px at 100% 0%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

  /* ============ 导航 ============ */
  .nav{
    position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;
    background:color-mix(in srgb,var(--surface) 82%,transparent);
    backdrop-filter:saturate(160%) blur(12px);
    -webkit-backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--border);
    transition:background .25s ease,border-color .25s ease;
  }
  .nav .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent)}
  .nav-links{display:flex;gap:4px;align-items:center}
  .nav-links a{
    font-size:14px;color:var(--muted);padding:7px 12px;border-radius:9px;
    transition:color .18s ease,background .18s ease;white-space:nowrap;
  }
  .nav-links a:hover{color:var(--text);background:var(--primary-soft)}
  .nav-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{
    width:38px;height:38px;border:1px solid var(--border);background:var(--surface);
    border-radius:10px;cursor:pointer;display:grid;place-items:center;
    color:var(--text);transition:transform .18s ease,background .18s ease,border-color .18s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);border-color:var(--primary)}
  .icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ============ 通用区块 ============ */
  section{padding:74px 0 8px;scroll-margin-top:calc(var(--nav-h) + 12px)}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .sec-head .idx{font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:8px}
  .sec-head h2{font-size:24px;font-weight:750;letter-spacing:.4px}
  .sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

  /* ============ Hero ============ */
  .hero{padding-top:calc(var(--nav-h) + 64px);min-height:88vh;display:flex;align-items:center}
  .hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;width:100%}
  .hero h1{font-size:clamp(30px,5vw,48px);font-weight:800;line-height:1.15;letter-spacing:.5px}
  .hero h1 .grad{background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .role{display:inline-flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--primary-ink);background:var(--primary-soft);padding:7px 14px;border-radius:999px;font-weight:600}
  .hero p.lede{color:var(--muted);font-size:16px;max-width:46ch}
  .badges{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}
  .badge{font-size:13px;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);transition:transform .18s ease,border-color .18s ease}
  .badge:hover{transform:translateY(-2px);border-color:var(--primary)}
  .badge.b2{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:11px;cursor:pointer;border:1px solid transparent;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
  }
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px color-mix(in srgb,var(--primary) 45%,transparent)}
  .btn.ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn.ghost:hover{transform:translateY(-2px);border-color:var(--primary)}
  .avatar{
    position:relative;aspect-ratio:1/1;border-radius:24px;overflow:hidden;
    background:linear-gradient(150deg,var(--primary-soft),var(--accent-soft));
    border:1px solid var(--border);display:grid;place-items:center;
    box-shadow:var(--shadow);
  }
  .avatar svg{width:62%;height:62%;opacity:.9}
  .avatar .ring{position:absolute;inset:14px;border:2px dashed color-mix(in srgb,var(--primary) 30%,transparent);border-radius:18px}

  /* ============ 卡片 / 网格 ============ */
  .grid{display:grid;gap:18px}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .grid.c2{grid-template-columns:repeat(2,1fr)}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  .card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}

  /* 亮点 */
  .hl .num{font-size:30px;font-weight:800;background:linear-gradient(120deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .hl .lab{font-size:14px;color:var(--muted);margin-top:8px;font-weight:600}
  .hl .desc{font-size:13px;color:var(--muted);margin-top:6px}

  /* ============ Tabs ============ */
  .tablist{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:13px;box-shadow:var(--shadow);margin-bottom:22px;flex-wrap:wrap}
  .tab{
    font-size:14px;font-weight:600;color:var(--muted);padding:9px 16px;border-radius:9px;cursor:pointer;
    border:none;background:transparent;transition:color .18s ease,background .18s ease;white-space:nowrap;
  }
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{background:var(--primary);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--primary) 35%,transparent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}

  /* 时间线（经历） */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--primary),transparent)}
  .tl-item{position:relative;padding-bottom:22px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
  .tl-item h4{font-size:16px;font-weight:700}
  .tl-item .meta{font-size:13px;color:var(--primary-ink);font-weight:600;margin:2px 0 8px}
  .tl-item ul{list-style:none;display:grid;gap:6px}
  .tl-item li{font-size:14px;color:var(--muted);padding-left:18px;position:relative}
  .tl-item li::before{content:"▹";position:absolute;left:0;color:var(--accent);font-weight:700}

  /* 项目卡片 */
  .proj .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .proj h4{font-size:16px;font-weight:700}
  .proj .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
  .proj p{font-size:13px;color:var(--muted);margin:10px 0 12px}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
  .proj .res{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
  .proj .res svg{width:15px;height:15px;fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .proj a.link{font-size:13px;color:var(--primary);font-weight:600}

  /* 技能矩阵 */
  .skill-cat h4{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .skill-cat h4 .ic{width:8px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--primary),var(--accent))}
  .skill-row{margin-bottom:14px}
  .skill-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .skill-row .top .nm{font-weight:600}
  .skill-row .top .pc{color:var(--muted)}
  .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .skills-badges{display:flex;flex-wrap:wrap;gap:8px}
  .skills-badges .b{font-size:12px;padding:5px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}

  /* 教育 / 证书 */
  .edu h4{font-size:17px;font-weight:700}
  .edu .meta{font-size:13px;color:var(--primary-ink);font-weight:600;margin:3px 0 12px}
  .edu ul{list-style:none;display:grid;gap:7px}
  .edu li{font-size:14px;color:var(--muted);padding-left:18px;position:relative}
  .edu li::before{content:"○";position:absolute;left:0;color:var(--primary)}
  .certs{display:flex;flex-wrap:wrap;gap:10px}
  .cert{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 15px;box-shadow:var(--shadow);transition:transform .18s ease}
  .cert:hover{transform:translateY(-3px)}
  .cert .ci{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));display:grid;place-items:center;color:var(--primary);font-weight:800;font-size:14px}
  .cert .ct{font-size:14px;font-weight:600}
  .cert .cs{font-size:12px;color:var(--muted)}

  /* 页脚 */
  footer{margin-top:70px;padding:30px 0 40px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:13px}
  footer .up{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--primary);font-weight:600;cursor:pointer}
  footer .up svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* 返回顶部 */
  #top{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:14px;background:var(--primary);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--primary) 45%,transparent);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s ease,transform .25s ease,z-index:40}
  #top.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #top svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* 进入动效 */
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .5s ease,transform .5s ease}
  .reveal.in{opacity:1;transform:none}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* 复制提示 */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ 响应式 ============ */
  @media(max-width:860px){
    .hero-grid{grid-template-columns:1fr;gap:28px}
    .avatar{max-width:240px;margin:0 auto;order:-1}
    .grid.c3,.grid.c2{grid-template-columns:1fr}
    .nav-links{display:none}
  }
  @media(max-width:560px){
    .wrap{padding:0 16px}
    .sec-head h2{font-size:21px}
    .tablist{width:100%}
  }

  /* ============ 打印 ============ */
  @media print{
    :root{--shadow:none;--shadow-hover:none}
    body::before{display:none}
    .nav,.nav-actions,.icon-btn,.cta,#top,.toast,.tablist{display:none !important}
    section{padding:18px 0 !important;scroll-margin-top:0}
    .hero{min-height:auto;padding-top:0}
    .card,.cert{box-shadow:none !important;border-color:#ccc}
    html,body{background:#fff !important;color:#000 !important}
    .panel{display:block !important;animation:none}
    .reveal{opacity:1 !important;transform:none !important}
    .bar > i{width:auto !important}
    a{color:#000}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>

// 经历 Tabs
function buildTabs(container, groups, renderPanel){
  const wrap = E("div");
  const list = E("div","tablist"); list.setAttribute("role","tablist");
  const panels = [];
  groups.forEach((g,idx)=>{
    const tab = E("button","tab",g.tab);
    tab.setAttribute("role","tab");
    tab.id = container.id + "-tab-" + idx;
    tab.setAttribute("aria-controls", container.id + "-panel-" + idx);
    tab.setAttribute("aria-selected", idx===0 ? "true":"false");
    tab.tabIndex = idx===0 ? 0 : -1;
    const panel = E("div","panel"+(idx===0?" active":""));
    panel.setAttribute("role","tabpanel");
    panel.id = container.id + "-panel-" + idx;
    panel.setAttribute("aria-labelledby", tab.id);
    panel.tabIndex = 0;
    renderPanel(panel, g);
    panels.push(panel);
    tab.addEventListener("click",()=>select(idx));
    tab.addEventListener("keydown",e=>onKey(e,idx,groups.length));
    list.appendChild(tab);
    wrap.appendChild(panel);
  });
  function select(i){
    list.querySelectorAll(".tab").forEach((t,j)=>{
      t.setAttribute("aria-selected", j===i?"true":"false");
      t.tabIndex = j===i?0:-1;
    });
    panels.forEach((p,j)=>p.classList.toggle("active", j===i));
  }
  function onKey(e,i,n){
    let ni=i;
    if(e.key==="ArrowRight"||e.key==="ArrowDown") ni=(i+1)%n;
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp") ni=(i-1+n)%n;
    else if(e.key==="Home") ni=0;
    else if(e.key==="End") ni=n-1;
    else return;
    e.preventDefault();
    select(ni);
    list.querySelectorAll(".tab")[ni].focus();
  }
  container.appendChild(list);
  container.appendChild(wrap);
}

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1600); }
const mailBtn = $("#ctaMail");

mailBtn.addEventListener("click",e=>{
  e.preventDefault();
  const addr = email();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(addr).then(()=>toast("邮箱已复制："+addr)).catch(()=>fallbackCopy(addr));
  } else fallbackCopy(addr);
});
function fallbackCopy(txt){
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制："+txt); }catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

// 进入动效
const io = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
}, {threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

// 技能条填充（进入视口时）
const bio = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      en.target.querySelectorAll(".bar > i").forEach(f=>{ f.style.width = f.dataset.pc + "%"; });
      bio.unobserve(en.target);
    }
  });
}, {threshold:.2});
document.querySelectorAll("#skills").forEach(el=>bio.observe(el));
